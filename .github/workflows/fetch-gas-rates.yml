name: Fetch Gas Rates

on:
  schedule:
    # Weekly Monday at 4 AM UTC (EIA gas data updates monthly, weekly is plenty)
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: fetch-gas-rates
  cancel-in-progress: false

jobs:
  fetch:
    uses: ./.github/workflows/_internal-cron.yml
    with:
      display-name: "Fetch Gas Rates"
      endpoint-path: /api/v1/internal/fetch-gas-rates
      slack-severity: info
    secrets: inherit
