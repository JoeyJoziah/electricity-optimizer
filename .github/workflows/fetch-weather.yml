name: Fetch Weather Data

on:
  schedule:
    # Every 12 hours (offset 15min from price-sync to avoid collision, optimized for GHA budget)
    - cron: "15 */12 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: fetch-weather
  cancel-in-progress: false

jobs:
  fetch:
    uses: ./.github/workflows/_internal-cron.yml
    with:
      display-name: "Fetch Weather Data"
      endpoint-path: /api/v1/internal/fetch-weather
      slack-severity: warning
      warmup-max-attempts: '3'
      warmup-delay-seconds: '10'
    secrets: inherit
