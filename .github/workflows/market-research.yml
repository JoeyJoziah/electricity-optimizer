name: Market Intelligence Scan

on:
  schedule:
    # Daily at 2 AM UTC
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: market-research
  cancel-in-progress: false

jobs:
  scan:
    uses: ./.github/workflows/_internal-cron.yml
    with:
      display-name: "Market Intelligence Scan"
      endpoint-path: /api/v1/internal/market-research
      body: '{"regions": ["NY","CA","TX","FL","IL","PA","OH","GA","NC","MI"]}'
      slack-severity: info
    secrets: inherit
