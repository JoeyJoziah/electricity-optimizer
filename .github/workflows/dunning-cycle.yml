name: Dunning Cycle

on:
  schedule:
    # Daily at 7am UTC
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: dunning-cycle
  cancel-in-progress: false

jobs:
  dunning:
    uses: ./.github/workflows/_internal-cron.yml
    with:
      display-name: "Dunning Cycle"
      endpoint-path: /api/v1/internal/dunning-cycle
      slack-severity: critical
    secrets: inherit
