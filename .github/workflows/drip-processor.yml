name: Drip Email Processor

on:
  schedule:
    # Daily at 09:00 UTC — process Day-2 and Day-7 drip batches
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: drip-processor
  cancel-in-progress: false

jobs:
  process:
    uses: ./.github/workflows/_internal-cron.yml
    with:
      display-name: "Drip Email Processor"
      endpoint-path: /api/v1/internal/drip/process
      slack-severity: warning
      job-timeout-minutes: 10
    secrets: inherit
