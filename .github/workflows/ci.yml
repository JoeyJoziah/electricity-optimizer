name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '20'

jobs:
  # ===========================================================================
  # Detect what changed to skip irrelevant jobs
  # ===========================================================================
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read

    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      ml: ${{ steps.filter.outputs.ml }}
      docker: ${{ steps.filter.outputs.docker }}
      workflows: ${{ steps.filter.outputs.workflows }}

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'requirements*.txt'
            frontend:
              - 'frontend/**'
            ml:
              - 'ml/**'
            docker:
              - '**/Dockerfile'
              - 'docker-compose*.yml'
            workflows:
              - '.github/**'

  # ===========================================================================
  # Backend: auto-format + lint + tests (reusable workflow)
  # ===========================================================================
  backend-lint:
    name: Backend Lint
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
          token: ${{ github.token }}

      - name: Setup Python environment
        uses: ./.github/actions/setup-python-env
        with:
          working-directory: backend

      - name: Install linting tools
        # Ruff is the canonical formatter + linter (see backend/pyproject.toml:134
        # and .pre-commit-config.yaml). Pinned to match requirements-dev.txt to keep
        # CI / pre-commit / dev environments in lockstep. Ruff replaces flake8;
        # mypy stays separate (different category — type checking, not lint).
        run: pip install ruff==0.15.6 mypy==1.19.1

      - name: Verify ruff format clean
        run: |
          cd backend
          ruff format --check . || {
            echo "::error::Code is not ruff-formatted. Run 'cd backend && ruff format .' locally and push the result, or let pre-commit handle it."
            exit 1
          }

      - name: Verify ruff lint clean
        # Uses backend/pyproject.toml configured select+ignore (notably F821
        # ignored for forward-ref string type hints). Same rule set as
        # pre-commit's `ruff` hook — guarantees CI and local agree.
        run: |
          cd backend
          ruff check . || {
            echo "::error::ruff check failed. Run 'cd backend && ruff check . --fix' locally to auto-fix where possible, or let pre-commit handle it."
            exit 1
          }

      # NOTE: flake8 was removed 2026-05-15. Ruff covers the same rule families
      # (E9, F63, F7, F82) via pyproject.toml's select=["E","W","F",...] and
      # respects the project's `ignore` list (notably F821 for forward-ref
      # string type hints). The "Verify ruff lint clean" step above replaces
      # the flake8 invocation. Complexity warnings (--max-complexity=10) were
      # advisory-only (--exit-zero); not currently enforced — re-add via ruff
      # `C901` if you want to gate on it.

      - name: Type check with mypy
        run: cd backend && mypy . --ignore-missing-imports --no-strict-optional
        continue-on-error: true

  backend-tests:
    name: Backend Tests
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.workflows == 'true'
    uses: ./.github/workflows/_backend-tests.yml
    with:
      coverage: true
      upload-codecov: true
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # ===========================================================================
  # ML Tests
  # ===========================================================================
  ml-tests:
    name: ML Tests
    needs: changes
    if: needs.changes.outputs.ml == 'true' || needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Force TensorFlow / PyTorch to CPU-only mode.  GitHub Actions runners have
    # no GPU and the CUDA runtime is not present, so any attempt to initialise
    # CUDA (which happens automatically on TF import) results in:
    #
    #   CUDA error: Failed call to cuInit: UNKNOWN ERROR (303)
    #
    # Setting CUDA_VISIBLE_DEVICES=-1 makes CUDA report "no devices" before the
    # runtime has a chance to fail.  TF_CPP_MIN_LOG_LEVEL=3 suppresses the
    # noisy C++ log messages so CI output stays readable.
    env:
      CUDA_VISIBLE_DEVICES: "-1"
      TF_CPP_MIN_LOG_LEVEL: "3"
      TF_ENABLE_ONEDNN_OPTS: "0"

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Python environment
        uses: ./.github/actions/setup-python-env
        with:
          working-directory: ml

      - name: Install test dependencies
        run: pip install pytest pytest-cov pytest-timeout

      - name: Run ML tests with coverage
        run: |
          cd ml
          pytest --cov=. --cov-report=xml --cov-report=term-missing -v \
            -m "not slow" \
            --timeout=120

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: ./ml/coverage.xml
          flags: ml
          name: ml-coverage
          fail_ci_if_error: false

  # ===========================================================================
  # Frontend: lint, tests, and build (parallel)
  # ===========================================================================
  frontend-lint:
    name: Frontend Lint
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
          token: ${{ github.token }}

      - name: Setup Node.js environment
        uses: ./.github/actions/setup-node-env

      - name: Auto-fix with ESLint
        id: lint
        run: |
          cd frontend
          npx eslint . --fix || true
          if git diff --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit lint fixes (PR only)
        if: steps.lint.outputs.has_changes == 'true' && github.event_name == 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/
          git commit -m "style: auto-fix ESLint issues"
          git push

      - name: Fail on unfixed lint pushed to main
        if: steps.lint.outputs.has_changes == 'true' && github.event_name == 'push'
        run: |
          echo "::error::ESLint issues found on main. Run 'cd frontend && npm run lint:fix' locally before pushing."
          exit 1

      - name: Verify lint passes
        run: cd frontend && npm run lint

  frontend-test:
    name: Frontend Test
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js environment
        uses: ./.github/actions/setup-node-env

      - name: Run unit tests with coverage
        run: cd frontend && npm test -- --coverage --watchAll=false --passWithNoTests

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: ./frontend/coverage
          flags: frontend
          name: frontend-coverage
          fail_ci_if_error: false

  frontend-build:
    name: Frontend Build
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js environment
        uses: ./.github/actions/setup-node-env

      - name: Cache Next.js build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: frontend/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}-${{ hashFiles('frontend/**/*.ts', 'frontend/**/*.tsx') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}-
            nextjs-${{ runner.os }}-

      - name: Build Next.js application
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: cd frontend && npm run build

  # ===========================================================================
  # Security Scan (blocking — no continue-on-error)
  # ===========================================================================
  security-scan:
    name: Security Scan
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true' || needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Python environment
        uses: ./.github/actions/setup-python-env
        with:
          working-directory: backend

      - name: Run Bandit (high-severity only)
        run: |
          pip install bandit==1.9.4
          cd backend
          bandit -r . -f json -o ../bandit-report.json -lll

      - name: Run Bandit on ML
        run: |
          cd ml
          bandit -r . -f json -o ../bandit-report-ml.json -lll

      - name: Run npm audit (high + critical, with documented exceptions)
        run: |
          cd frontend
          # npm audit exits non-zero whenever any vuln exists; capture to a file so
          # the allow-list script decides pass/fail. See .github/scripts/check_npm_audit.py
          # for the documented `next`/`kysely` exceptions (review by 2026-07-01).
          npm audit --json > /tmp/npm-audit.json || true
          python3 ../.github/scripts/check_npm_audit.py < /tmp/npm-audit.json

      - name: Upload security reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: security-reports
          path: |
            bandit-report.json
            bandit-report-ml.json

  # ===========================================================================
  # Migration Validation
  # ===========================================================================
  migration-check:
    name: Migration Validation
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: migration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Convention checks
        uses: ./.github/actions/validate-migrations

      - name: Apply all migrations sequentially
        run: |
          echo "Applying all migrations to verify SQL syntax..."
          # The migrations target Neon, where `neondb_owner` is the database owner
          # and GRANT ... TO neondb_owner statements (in ~50 migrations) assume it
          # exists. The vanilla postgres service has no such role, so provision it
          # idempotently to mirror the production target before replaying.
          PGPASSWORD=postgres psql -h localhost -U postgres -d migration_test \
            -v ON_ERROR_STOP=1 \
            -c "DO \$\$ BEGIN CREATE ROLE neondb_owner; EXCEPTION WHEN duplicate_object THEN NULL; END \$\$;"
          echo "Ensured role: neondb_owner"
          # Apply init_neon first
          PGPASSWORD=postgres psql -h localhost -U postgres -d migration_test \
            -v ON_ERROR_STOP=1 -f backend/migrations/init_neon.sql
          echo "Applied: init_neon.sql"

          # Apply numbered migrations in order
          for f in $(ls backend/migrations/[0-9]*.sql | sort); do
            PGPASSWORD=postgres psql -h localhost -U postgres -d migration_test \
              -v ON_ERROR_STOP=1 -f "$f"
            echo "Applied: $(basename $f)"
          done
          echo "All migrations applied successfully."

  # ===========================================================================
  # Docker Build Validation (no push — tests must pass first)
  # ===========================================================================
  docker-build:
    name: Docker Build Test
    needs: [changes, backend-tests, frontend-lint, frontend-test, frontend-build]
    if: |
      always() &&
      (needs.changes.outputs.docker == 'true' || needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true') &&
      (needs.backend-tests.result == 'success' || needs.backend-tests.result == 'skipped') &&
      (needs.frontend-lint.result == 'success' || needs.frontend-lint.result == 'skipped') &&
      (needs.frontend-test.result == 'success' || needs.frontend-test.result == 'skipped') &&
      (needs.frontend-build.result == 'success' || needs.frontend-build.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build backend image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: electricity-optimizer-backend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
          target: production

      - name: Build frontend image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: electricity-optimizer-frontend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
          target: production
          build-args: |
            NEXT_PUBLIC_API_URL=http://backend:8000
            NEXT_PUBLIC_APP_URL=https://rateshift.app

  # ===========================================================================
  # Doc Coverage Check (warning only — never blocks CI)
  # ===========================================================================
  doc-coverage:
    name: Doc Coverage
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Check doc coverage
        run: python scripts/doc-coverage-check.py --ci --format github

      - name: Add coverage summary
        if: always()
        run: |
          echo "## Doc Coverage" >> $GITHUB_STEP_SUMMARY
          python scripts/doc-coverage-check.py --ci 2>/dev/null >> $GITHUB_STEP_SUMMARY || true

  # ===========================================================================
  # Storybook Build Check (warning only — never blocks CI)
  # ===========================================================================
  storybook:
    name: Storybook Build
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js environment
        uses: ./.github/actions/setup-node-env

      - name: Build Storybook
        run: cd frontend && npm run build-storybook

      - name: Add build summary
        if: always()
        run: |
          if [ $? -eq 0 ]; then
            echo "## Storybook Build: OK" >> $GITHUB_STEP_SUMMARY
          else
            echo "## Storybook Build: FAILED (warning)" >> $GITHUB_STEP_SUMMARY
          fi

  # ===========================================================================
  # Notify on CI Failure
  # ===========================================================================
  notify-failure:
    name: Notify CI Failure
    runs-on: ubuntu-latest
    needs: [backend-lint, backend-tests, ml-tests, frontend-lint, frontend-test, frontend-build, security-scan, migration-check, docker-build]
    if: failure()
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          sparse-checkout: .github/actions

      - name: Notify Slack
        uses: ./.github/actions/notify-slack
        with:
          webhook-url: ${{ secrets.SLACK_INCIDENTS_WEBHOOK_URL }}
          workflow-name: "CI Pipeline"
          severity: warning
