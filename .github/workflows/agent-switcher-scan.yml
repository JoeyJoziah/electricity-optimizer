name: Agent Switcher - Daily Scan

on:
  schedule:
    # Daily at 4am UTC — decision engine scan for all enrolled users
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: agent-switcher-scan
  cancel-in-progress: false

jobs:
  scan:
    uses: ./.github/workflows/_internal-cron.yml
    with:
      display-name: "Agent Switcher - Daily Scan"
      endpoint-path: /api/v1/internal/agent-switcher/scan
      slack-severity: warning
      job-timeout-minutes: 10
      curl-timeout: '300'
    secrets: inherit
