name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
    paths:
      - 'workers/api-gateway/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

permissions: {}

concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  test:
    name: Test Worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          sparse-checkout: |
            workers/api-gateway

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: workers/api-gateway/package-lock.json

      - name: Install dependencies
        working-directory: workers/api-gateway
        run: npm ci

      - name: Lint
        working-directory: workers/api-gateway
        run: npm run lint

      - name: Type check
        working-directory: workers/api-gateway
        run: npm run typecheck

      - name: Run tests
        working-directory: workers/api-gateway
        run: npm test

  deploy:
    name: Deploy to Cloudflare
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          sparse-checkout: |
            workers/api-gateway
            .github/actions

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: workers/api-gateway/package-lock.json

      - name: Install dependencies
        working-directory: workers/api-gateway
        run: npm ci

      - name: Deploy Worker
        working-directory: workers/api-gateway
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Cron-failure alerts (scheduled.ts) post to Slack only when the Worker
      # has this secret. Sync it from the repo secret on every deploy so the
      # two cannot drift; skipped when the repo secret is not configured.
      - name: Sync Slack incidents webhook to the Worker
        working-directory: workers/api-gateway
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SLACK_INCIDENTS_WEBHOOK_URL: ${{ secrets.SLACK_INCIDENTS_WEBHOOK_URL }}
        run: |
          if [ -z "$SLACK_INCIDENTS_WEBHOOK_URL" ]; then
            echo "::warning::SLACK_INCIDENTS_WEBHOOK_URL repo secret is not set; Worker cron alerts stay off."
            exit 0
          fi
          printf '%s' "$SLACK_INCIDENTS_WEBHOOK_URL" | npx wrangler secret put SLACK_INCIDENTS_WEBHOOK_URL

      - name: Smoke test
        uses: ./.github/actions/retry-curl
        with:
          url: https://api.rateshift.app/health
          method: GET
          max-retries: "3"
          initial-delay: "10"
          timeout: "30"

  notify-failure:
    name: Notify on failure
    needs: [test, deploy]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          sparse-checkout: .github/actions
      - uses: ./.github/actions/notify-slack
        with:
          webhook-url: ${{ secrets.SLACK_INCIDENTS_WEBHOOK_URL }}
          workflow-name: "Cloudflare Worker deploy failed"
          severity: "critical"
