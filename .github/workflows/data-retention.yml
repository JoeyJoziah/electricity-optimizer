name: Data Retention Cleanup

on:
  schedule:
    # Run every Sunday at 4 AM UTC (avoids scrape-rates at 3am)
    - cron: "0 4 * * *"  # daily: also sweeps bill uploads stuck mid-parse
  workflow_dispatch:

permissions: {}

concurrency:
  group: data-retention
  cancel-in-progress: false

jobs:
  cleanup:
    uses: ./.github/workflows/_internal-cron.yml
    with:
      display-name: "Data Retention Cleanup"
      endpoint-path: /api/v1/internal/maintenance/cleanup
      slack-severity: warning
    secrets: inherit
