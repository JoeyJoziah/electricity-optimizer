name: Nightly KPI Report

on:
  schedule:
    # Daily at 6am UTC
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: kpi-report
  cancel-in-progress: false

jobs:
  report:
    uses: ./.github/workflows/_internal-cron.yml
    with:
      display-name: "Nightly KPI Report"
      endpoint-path: /api/v1/internal/kpi-report
      slack-severity: info
    secrets: inherit
