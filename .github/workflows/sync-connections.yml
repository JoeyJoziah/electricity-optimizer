name: Sync User Connections

on:
  schedule:
    # Every 6 hours — aligns with UtilityAPI update frequency
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: sync-connections
  cancel-in-progress: false

jobs:
  sync:
    uses: ./.github/workflows/_internal-cron.yml
    with:
      display-name: "Sync User Connections"
      endpoint-path: /api/v1/internal/sync-connections
      slack-severity: warning
      job-timeout-minutes: 10
      warmup-max-attempts: '3'
      warmup-delay-seconds: '10'
    secrets: inherit
